name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile so CI installs what a contributor's checkout does.
      # The other half of that question (what a *new* installer resolves once
      # a dependency publishes) is latest-engine.yml's job.
      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun test

      - run: bun run build

      # The React Email example, against this build: a user's test with
      # expectEmailToPass. It fails on an engine that reports false dark-mode
      # errors on an ordinary welcome email.
      - run: cd examples/react-email && npm install && npm install --no-save ../.. && npx vitest run
